name: Gerar APK LolPro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependencias
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Godot
        run: |
          V=4.7.2
          URL=https://github.com/godotengine/godot-builds/releases/download/$V-stable
          wget "$URL/Godot_v$V-stable_linux.x86_64.zip"
          unzip "Godot_v$V-stable_linux.x86_64.zip"
          sudo mv "Godot_v$V-stable_linux.x86_64" /usr/local/bin/godot
          wget "$URL/Godot_v$V-stable_export_templates.tpz"
          unzip "Godot_v$V-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/$V.stable

      - name: Configurar assinatura Android persistente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions Secret $name ausente. Configure os quatro secrets indicados no guia privado de assinatura."
              exit 1
            fi
          done
          mkdir -p ~/.android ~/.config/godot
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/lolpro-release.keystore
          keytool -list -keystore ~/.android/lolpro-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf '[gd_resource type="EditorSettings" format=3]\\n\\n[resource]\\nexport/android/android_sdk_path = "%s"\\nexport/android/java_sdk_path = "%s"\\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          python3 - <<'PY'
          import os
          p = "export_presets.cfg"
          content = open(p, encoding="utf-8").read()
          marker = "[preset.0.options]\\n"
          if marker not in content:
              raise SystemExit("Preset Android não encontrado em export_presets.cfg")
          lines = (
              'keystore/release="/home/runner/.android/lolpro-release.keystore"\\n'
              'keystore/release_user="' + os.environ["ANDROID_KEY_ALIAS"] + '"\\n'
              'keystore/release_password="' + os.environ["ANDROID_KEY_PASSWORD"] + '"\\n'
          )
          content = content.replace(marker, marker + lines, 1)
          open(p, "w", encoding="utf-8").write(content)
          PY

      - name: Importar jogo
        run: godot --headless --editor --import

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/LolPro.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LolPro-Android-Signed
          path: build/LolPro.apk
          if-no-files-found: error
