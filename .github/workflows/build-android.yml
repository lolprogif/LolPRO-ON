name: Gerar APK LolPro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Godot
        run: |
          V=4.7.2
          URL=https://github.com/godotengine/godot-builds/releases/download/$V-stable
          wget "$URL/Godot_v$V-stable_linux.x86_64.zip"
          unzip "Godot_v$V-stable_linux.x86_64.zip"
          sudo mv "Godot_v$V-stable_linux.x86_64" /usr/local/bin/godot
          wget "$URL/Godot_v$V-stable_export_templates.tpz"
          unzip "Godot_v$V-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/$V.stable

      - name: Configurar Android
        run: |
          mkdir -p ~/.android ~/.config/godot
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME" > ~/.config/godot/editor_settings-4.7.tres

      - name: Importar jogo
        run: godot --headless --editor --import

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/LolPro.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LolPro-Android
          path: build/LolPro.apk
          if-no-files-found: error
