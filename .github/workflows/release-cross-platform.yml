name: Publicar versão LolPRO-ON (Windows + Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem v (ex.: 0.10.0)"
        required: true
        type: string
  push:
    branches:
      - "fix/release-updater-validation"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot e templates
        shell: pwsh
        run: |
          $version = "4.7.2"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$version-stable"
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip godot
          $godot = (Get-ChildItem godot -Filter Godot*.exe | Select-Object -First 1).FullName
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz templates
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/$version.stable" | Out-Null
          Copy-Item "templates/templates/*" "$env:APPDATA/Godot/export_templates/$version.stable" -Recurse -Force
          "GODOT_EXE=$godot" >> $env:GITHUB_ENV
      - name: Definir versão do jogo
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") { $v = $env:INPUT_VERSION } else { $v = $env:REF_NAME.TrimStart("v") }
          $path = "login.gd"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, 'const CURRENT_GAME_VERSION := "[^"]+"', ('const CURRENT_GAME_VERSION := "' + $v + '"'))
          Set-Content -Path $path -Value $text -NoNewline
      - name: Importar e exportar
        shell: pwsh
        run: |
          & "$env:GODOT_EXE" --headless --editor --path . --import
          New-Item -ItemType Directory -Force build | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" build/LolPRO-ON.exe
      - name: Montar pacote Windows
        shell: pwsh
        run: |
          Copy-Item account_server.py,INICIAR_CONTAS.bat,REDEFINIR_SENHA.py,updater.ps1 build/
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>nul
          if errorlevel 1 (
            echo Python 3 nao foi encontrado. Instale Python 3 e marque Add Python to PATH.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p=Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue; if(-not $p){Start-Process -FilePath 'py' -ArgumentList '-3','account_server.py' -WorkingDirectory '%~dp0' -WindowStyle Hidden}"
          timeout /t 2 /nobreak >nul
          start "" "%~dp0LolPRO-ON.exe"
          '@ | Set-Content -Encoding ASCII build/INICIAR_LOLPRO.bat
          Compress-Archive -Path build/* -DestinationPath LolPRO-ON-Windows.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: LolPRO-ON-Windows
          path: LolPRO-ON-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Instalar SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Godot
        run: |
          V=4.7.2
          URL=https://github.com/godotengine/godot-builds/releases/download/$V-stable
          wget "$URL/Godot_v$V-stable_linux.x86_64.zip"
          unzip "Godot_v$V-stable_linux.x86_64.zip"
          sudo mv "Godot_v$V-stable_linux.x86_64" /usr/local/bin/godot
          wget "$URL/Godot_v$V-stable_export_templates.tpz"
          unzip "Godot_v$V-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/$V.stable
      - name: Configurar assinatura Android persistente
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Secret $name ausente"; exit 1; fi
          done
          mkdir -p ~/.android ~/.config/godot
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/lolpro-release.keystore
          keytool -list -keystore ~/.android/lolpro-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf '[gd_resource type="EditorSettings" format=3]\\n\\n[resource]\\nexport/android/android_sdk_path = "%s"\\nexport/android/java_sdk_path = "%s"\\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          python3 - <<'PY'
          import os
          p = "export_presets.cfg"
          s = open(p, encoding="utf-8").read()
          marker = "[preset.0.options]\\n"
          if marker not in s: raise SystemExit("Preset Android não encontrado")
          values = 'keystore/release="/home/runner/.android/lolpro-release.keystore"\\nkeystore/release_user="' + os.environ["ANDROID_KEY_ALIAS"] + '"\\nkeystore/release_password="' + os.environ["ANDROID_KEY_PASSWORD"] + '"\\n'
          s = s.replace(marker, marker + values, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Configurar assinatura de teste Android para validar branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p ~/.android ~/.config/godot
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          python3 - <<'PY'
          p = "export_presets.cfg"
          s = open(p, encoding="utf-8").read()
          marker = "[preset.0.options]\n"
          values = 'keystore/debug="/home/runner/.android/debug.keystore"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n'
          if marker not in s: raise SystemExit("Preset Android não encontrado")
          open(p, "w", encoding="utf-8").write(s.replace(marker, marker + values, 1))
          PY
      - name: Definir versão Android
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then VERSION="$INPUT_VERSION"; else VERSION="${REF_NAME#v}"; fi
          export VERSION
          python3 - <<'PY'
          import os,re
          v=os.environ["VERSION"]
          nums=[int(x) for x in re.findall(r"\d+",v)]
          if not nums: raise SystemExit("Versão inválida")
          code=nums[0]*10000+(nums[1] if len(nums)>1 else 0)*100+(nums[2] if len(nums)>2 else 0)
          p="export_presets.cfg"; s=open(p,encoding="utf-8").read()
          s=re.sub(r'version/code=\d+',f'version/code={code}',s, count=1)
          s=re.sub(r'version/name="[^"]+"',f'version/name="{v}"',s, count=1)
          open(p,"w",encoding="utf-8").write(s)
          login="login.gd"
          text=open(login,encoding="utf-8").read()
          text=re.sub(r'const CURRENT_GAME_VERSION := "[^"]+"',f'const CURRENT_GAME_VERSION := "{v}"',text)
          open(login,"w",encoding="utf-8").write(text)
          PY
      - name: Importar e exportar APK para validar branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          godot --headless --editor --import
          mkdir -p build
          godot --headless --export-debug "Android" build/LolPRO-ON-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/LolPRO-ON-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/LolPRO-ON-Android.apk | grep -q "com.rpg.mundointernacional"
      - name: Importar e exportar APK assinado para distribuição
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          godot --headless --editor --import
          mkdir -p build
          godot --headless --export-release "Android" build/LolPRO-ON-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/LolPRO-ON-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/LolPRO-ON-Android.apk | grep -q "com.rpg.mundointernacional"
      - uses: actions/upload-artifact@v4
        with:
          name: LolPRO-ON-Android
          path: build/LolPRO-ON-Android.apk

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Determinar versão
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then VERSION="$INPUT_VERSION"; else VERSION="${REF_NAME#v}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publicar GitHub Release gratuita
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LolPRO-ON v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release-assets/LolPRO-ON-Windows/LolPRO-ON-Windows.zip
            release-assets/LolPRO-ON-Android/LolPRO-ON-Android.apk
      - name: Atualizar manifesto público do jogo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" repo
          cd repo
          cat > latest.json <<EOF
          {
            "app": "LolPRO-ON",
            "version": "$VERSION",
            "windows_url": "https://github.com/${{ github.repository }}/releases/latest/download/LolPRO-ON-Windows.zip",
            "android_url": "https://github.com/${{ github.repository }}/releases/latest/download/LolPRO-ON-Android.apk"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish update manifest for v$VERSION"
          git push
