name: Gerar LolPRO-ON Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot e templates
        shell: pwsh
        run: |
          $version = "4.7.2"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$version-stable"
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip godot
          $godot = (Get-ChildItem godot -Filter Godot*.exe | Select-Object -First 1).FullName
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz templates
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/$version.stable" | Out-Null
          Copy-Item "templates/templates/*" "$env:APPDATA/Godot/export_templates/$version.stable" -Recurse -Force
          "$godot" | Out-File godot-path.txt
          echo "GODOT_EXE=$godot" >> $env:GITHUB_ENV

      - name: Importar projeto
        run: '& "$env:GODOT_EXE" --headless --editor --path . --import'

      - name: Exportar Windows
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" build/LolPRO-ON.exe

      - name: Incluir servidor de contas e inicializadores
        shell: pwsh
        run: |
          Copy-Item account_server.py build/account_server.py
          Copy-Item INICIAR_CONTAS.bat build/INICIAR_CONTAS.bat
          @'
          @echo off
          cd /d "%~dp0"
          where py >nul 2>nul
          if errorlevel 1 (
            echo Python 3 nao foi encontrado. Instale Python 3 e marque Add Python to PATH.
            pause
            exit /b 1
          )
          start "Servidor de contas LolPRO" cmd /k "cd /d ""%~dp0"" && py -3 account_server.py"
          timeout /t 2 /nobreak >nul
          start "" "%~dp0LolPRO-ON.exe"
          '@ | Set-Content -Encoding ASCII build/INICIAR_LOLPRO.bat
          @'
          LolPRO-ON V0.9 - pacote Windows de teste

          ARQUIVOS
          - LolPRO-ON.exe e LolPRO-ON.pck: jogo para Windows.
          - account_server.py: servidor local de cadastro/login.
          - INICIAR_CONTAS.bat: inicia somente o servidor de contas.
          - INICIAR_LOLPRO.bat: inicia o servidor de contas e abre o jogo.
          - Python 3 precisa estar instalado no PC anfitriao.

          COMO USAR PC + ANDROID NA MESMA REDE
          1. Conecte PC e telefone ao mesmo Wi-Fi/rede local.
          2. No PC, execute INICIAR_LOLPRO.bat e permita acesso na rede privada
             quando o Firewall do Windows perguntar.
          3. No telefone, abra LolPRO-ON e toque em Localizar servidor.
             Se nao localizar, informe o IPv4 do PC no campo Servidor:
             http://IP-DO-PC:8080
          4. Para multiplayer, no PC use Rede > Hospedar. No telefone use
             Rede > Conectar com o IPv4 do PC.
          5. As portas usadas na rede privada sao TCP 8080 (contas),
             UDP 8081 (descoberta) e UDP 7000 (jogo).

          IMPORTANTE
          - Este e um pacote experimental para rede local, nao para internet publica.
          - Contas ficam no arquivo accounts.sqlite3, criado ao iniciar o servidor.
          - Cadastro/login e salvamento do nome do personagem nao sincronizam
            inventario, progresso ou estado do mundo.
          - Mantenha o servidor aberto enquanto o telefone estiver conectado.
          - Se o Windows bloquear, permita Python/LolPRO somente em redes privadas.
          '@ | Set-Content -Encoding UTF8 build/LEIA-ME-WINDOWS.txt

      - name: Disponibilizar pacote Windows completo
        uses: actions/upload-artifact@v4
        with:
          name: LolPRO-ON-Windows
          path: build/
          if-no-files-found: error
