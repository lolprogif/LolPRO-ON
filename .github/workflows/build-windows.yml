name: Gerar e publicar LolPRO-ON Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "latest.json"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir versão desta compilação
        shell: pwsh
        run: |
          $version = "0.9.$(git rev-list --count HEAD)"
          (Get-Content project.godot -Raw) -replace 'config/version="[^"]+"', "config/version=`"$version`"" | Set-Content project.godot
          (Get-Content login.gd -Raw) -replace 'const CURRENT_VERSION := "[^"]+"', "const CURRENT_VERSION := `"$version`"" | Set-Content login.gd
          "APP_VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Instalar Godot e templates
        shell: pwsh
        run: |
          $version = "4.7.2"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$version-stable"
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip godot
          $godot = (Get-ChildItem godot -Filter Godot*.exe | Select-Object -First 1).FullName
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz templates
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/$version.stable" | Out-Null
          Copy-Item "templates/templates/*" "$env:APPDATA/Godot/export_templates/$version.stable" -Recurse -Force
          "GODOT_EXE=$godot" | Out-File -Append $env:GITHUB_ENV

      - name: Importar projeto
        run: '& "$env:GODOT_EXE" --headless --editor --path . --import'

      - name: Exportar Windows
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & "$env:GODOT_EXE" --headless --path . --export-release "Windows Desktop" build/LolPRO-ON.exe

      - name: Incluir servidor, atualizador e inicializadores
        shell: pwsh
        run: |
          Copy-Item account_server.py build/account_server.py
          Copy-Item update_windows.ps1 build/update_windows.ps1
          Copy-Item INICIAR_CONTAS.bat build/INICIAR_CONTAS.bat
          Copy-Item REDEFINIR_SENHA.py build/REDEFINIR_SENHA.py
          Copy-Item RESETAR_CONTAS_TESTE.py build/RESETAR_CONTAS_TESTE.py
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>nul
          if errorlevel 1 (
            echo Python 3 nao foi encontrado. Instale Python 3 e marque Add Python to PATH.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$p=Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue; if(-not $p){Start-Process -FilePath 'py' -ArgumentList '-3','account_server.py' -WorkingDirectory '%~dp0' -WindowStyle Hidden}"
          timeout /t 2 /nobreak >nul
          start "" "%~dp0LolPRO-ON.exe"
          exit /b 0
          '@ | Set-Content -Encoding ASCII build/INICIAR_LOLPRO.bat
          @'
          LolPRO-ON - pacote Windows

          INICIAR_LOLPRO.bat inicia o servidor de contas em segundo plano e abre o jogo.
          INICIAR_CONTAS.bat inicia o servidor manualmente para diagnostico.
          REDEFINIR_SENHA.py redefine a senha localmente sem apagar o personagem.
          Requer Python 3 instalado.

          O atualizador dentro do jogo consulta a versao publicada e aplica o ZIP
          automaticamente no Windows. A base accounts.sqlite3 e preservada.
          '@ | Set-Content -Encoding UTF8 build/LEIA-ME-WINDOWS.txt

      - name: Disponibilizar pacote Windows completo
        uses: actions/upload-artifact@v4
        with:
          name: LolPRO-ON-Windows
          path: build/
          if-no-files-found: error

      - name: Compactar pacote de distribuição
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path build/* -DestinationPath LolPRO-ON-Windows.zip -Force

      - name: Publicar Release Windows e atualizar manifesto
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag LolPRO-ON-Windows.zip --clobber
            gh release edit $tag --title "LolPRO-ON $env:APP_VERSION" --notes "Atualização automática do LolPRO-ON para Windows." --latest
          } else {
            gh release create $tag LolPRO-ON-Windows.zip --title "LolPRO-ON $env:APP_VERSION" --notes "Atualização automática do LolPRO-ON para Windows." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a Release do Windows." }
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/LolPRO-ON-Windows.zip"
          $saved = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            $current = gh api "repos/$env:GITHUB_REPOSITORY/contents/latest.json" | ConvertFrom-Json
            $manifest = @{
              app = "LolPRO-ON"
              version = $env:APP_VERSION
              windows_url = $assetUrl
              android_url = ""
              status = "published"
            }
            try {
              $oldText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($current.content))
              $oldManifest = $oldText | ConvertFrom-Json
              if ($oldManifest.android_url) { $manifest.android_url = $oldManifest.android_url }
            } catch {}
            $json = $manifest | ConvertTo-Json -Depth 5
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))
            gh api "repos/$env:GITHUB_REPOSITORY/contents/latest.json" -X PUT -f message="Publish LolPRO-ON $env:APP_VERSION" -f content="$encoded" -f sha="$($current.sha)" -f branch="main"
            if ($LASTEXITCODE -eq 0) { $saved = $true; break }
            Start-Sleep -Seconds 4
          }
          if (-not $saved) { throw "Falha ao atualizar latest.json após várias tentativas." }
